<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F&amp;G Belleza Intima — stock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="eyebrow">F&amp;G</div>
  <div class="wordmark">Belleza Intima</div>
  <div class="subtitle">control de stock por marca</div>
</header>

<nav class="tab-bar" id="tabBar"></nav>

<main>
  <section class="panel">
    <div class="brand-identity" id="brandIdentity"></div>

    <div class="panel-header">
      <h2 id="productCount">0 artículos</h2>
      <button class="icon-btn" id="toggleNewProduct"><i class="fa-solid fa-plus"></i> nuevo artículo</button>
    </div>

    <div class="panel-body" id="newProductPanel" style="display:none;">
      <form id="newProductForm">
        <div class="field-row">
          <div class="field"><label>Código</label><input id="newCode" type="text" placeholder="PP-3065" required></div>
          <div class="field"><label>Descripción</label><input id="newName" type="text" placeholder="Brasier lace push-up" required></div>
        </div>

        <div class="field"><label>Tallas que maneja este artículo</label></div>
        <div class="size-picker" id="sizePicker"></div>

        <div class="field-row">
          <div class="field">
            <label>Precio de compra (docena, fijo)</label>
            <input id="newPurchaseDozen" type="number" step="0.01" placeholder="170.00">
          </div>
          <div class="field">
            <label>Precio de venta (por unidad)</label>
            <input id="newSaleUnit" type="number" step="0.01" placeholder="25.00">
          </div>
        </div>
        <p style="font-size:11px; color:var(--ink-soft); margin:0 0 10px;">
          Cuarto, media docena y docena se calculan automáticamente desde el precio por unidad
          (×3, ×6, ×12). Se pueden ajustar manualmente después desde Supabase si un artículo tiene un precio especial.
        </p>

        <button class="btn-primary" type="submit"><i class="fa-solid fa-plus"></i> crear artículo</button>
      </form>
    </div>

    <div id="productList"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>Movimientos de la marca</h2>
    </div>
    <div class="panel-body">
      <select id="movementFilter" style="width:100%; margin-bottom:12px;"></select>
      <div class="movement-summary" id="movementSummary"></div>
      <div id="movementList"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
